# ! This WILL BE pushed to git, and MUST NOT contain any secrets.
# Contains default values for local.properties which the Secrets Gradle plugin
# can fall back to when missing, so the build will not fail.
# This allows for e.g. working on UI without obtaining API keys.

# Frost API client ID — https://frost.met.no/auth/requestCredentials.html
# ! KEEP EMPTY HERE. FILL IN UNCOMMITED local.properties
FROST_CLIENT_ID=

# Frost API client secret — Obtained when registering the client ID
# Required for restricted data (OAuth2)
# ! KEEP EMPTY HERE. FILL IN UNCOMMITED local.properties
# FROST_CLIENT_SECRET=
# Uncomment when actually needed for restricted Frost data (OAuth2)

# Mapbox access token — get from https://console.mapbox.com/
# ! KEEP EMPTY HERE. FILL IN UNCOMMITED local.properties
MAPBOX_ACCESS_TOKEN=